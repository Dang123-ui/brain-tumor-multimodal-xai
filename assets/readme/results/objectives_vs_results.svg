<svg width="1200" height="640" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Technical objectives versus achieved results</title>
  <desc id="desc">Bar chart comparing target metrics and achieved metrics for detection, segmentation, and classification.</desc>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111827">Comparison Between Technical Targets and Achieved Results</text>
  <text x="600" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280">Detection, segmentation, and classification metrics reported in the thesis</text>

  <line x1="80" y1="560" x2="1140" y2="560" stroke="#111827" stroke-width="2"/>
  <line x1="80" y1="100" x2="80" y2="560" stroke="#111827" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280">
