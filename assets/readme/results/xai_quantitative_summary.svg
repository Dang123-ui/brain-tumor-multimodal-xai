<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">XAI quantitative summary</title>
  <desc id="desc">Bar chart summarizing ODAM, Seg-Eigen-CAM, and Finer-CAM metrics.</desc>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111827">XAI Quantitative Summary</text>
  <text x="600" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280">Heatmap relevance to model decisions across detection, segmentation, and classification</text>

  <line x1="80" y1="450" x2="1140" y2="450" stroke="#111827" stroke-width="2"/>
  <line x1="80" y1="100" x2="80" y2="450" stroke="#111827" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280">
