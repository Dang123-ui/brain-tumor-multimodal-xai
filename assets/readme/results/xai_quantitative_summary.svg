  <text x="390" y="472" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111827">ODAM</text>
  <text x="390" y="492" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111827">Drop@20</text>

  <rect x="520" y="103" width="140" height="347" fill="#10b981"/>
  <text x="590" y="93" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#10b981">99.08%</text>
  <text x="590" y="472" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111827">Seg-Eigen-CAM</text>
  <text x="590" y="492" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111827">Pointing GT Mask</text>

  <rect x="720" y="367" width="140" height="83" fill="#8b5cf6"/>
  <text x="790" y="357" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8b5cf6">23.77%</text>
  <text x="790" y="472" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111827">Finer-CAM</text>
  <text x="790" y="492" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111827">Drop@20</text>

