  <rect x="120" y="104" width="140" height="346" fill="#2563eb"/>
  <text x="190" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#2563eb">98.98%</text>
  <text x="190" y="472" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111827">ODAM</text>
  <text x="190" y="492" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111827">Pointing BBox</text>

  <rect x="320" y="161" width="140" height="289" fill="#3b82f6"/>
